services:
  db:
    image: postgres:16-alpine
    container_name: wedding-invite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding_invite
    ports:
      # 5434 on the host so it doesn't clash with a locally installed Postgres on 5432
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding_invite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
